[project]
name = "scribe"
version = "0.1.0"
description = "Durable execution runtime for multi-agent LLM systems"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "aiosqlite>=0.20",
    "langgraph>=1.2.10",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.6.1",
    "numpy>=2.5.1",
]

[project.scripts]
da = "scribe.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]
agent = [
    "docker>=7.1",
]
eval = [
    "datasets>=3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"agent".msg = "scribe/ must never import from agent/ - see ADR 0003"
"api".msg = "scribe/ must never import from api/ - see ADR 0003"
"eval".msg = "scribe/ must never import from eval/ - see ADR 0003"

[tool.ruff.lint.per-file-ignores]
# The banned-api rule above encodes ADR 0003: scribe/ never imports
# agent/api/eval. It is not a ban on those packages existing or being
# imported by each other -- scope TID251 to scribe/ only.
"agent/**" = ["TID251"]
"api/**" = ["TID251"]
"eval/**" = ["TID251"]
"tests/**" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scribe"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scribe", "agent", "eval"]
